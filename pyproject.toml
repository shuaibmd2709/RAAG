[project]
name = "raag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
